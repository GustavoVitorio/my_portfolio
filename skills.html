<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/nav_footer.css">
    <link rel="stylesheet" href="./style/skills.css">
    <title>Skills</title>
</head>
<body>
    <div id="introducao">
        <header>
            <button type="button" id="nav_bar">
                <h2>./GV</h2>
                <img src="./img/icons/seta_para_baixo__azul.png" alt="seta para baixo">
            </button>
        </header>
        <nav>
            <a href="./index.html" id="home" class="link-nav">HOME</a>
            <a href="./about.html" id="about" class="link-nav">SOBRE</a>
            <a href="./skills.html" id="skills" class="link-nav">SKILLs</a>
            <a href="./projects.html" id="projects" class="link-nav">PROJETOs</a>
            <a href="./contact.html" id="contact" class="link-nav">CONTATO</a>
        </nav>
    </div>

    <main>
        <h1> Tech <span>Stack</span><br> & <br>Hard Skills</h1>
        <section>

            <!-- Front-end -->
            
            <button type="button" id="frontend" class="cards-section">

                <!-- Titúlo Front-end -->
                
                <div class="title-element">
                    <img src="./img/icons/Fornt-end.png" alt="">
                    <h3>Front-end</h3>

                    <div>
                        <p>+</p>
                    </div>
                </div>

                <!-- Elementos Front-end -->
                
                <div class="elements-section">
                    
                    <div class="element">
                        <img src="./img/icons/HTML.png" alt="icone do HTML5." class="icon img-skills">
                        <h4>HTML5</h4>
                    </div>
                    <div class="barra" data-level="avancado"></div>
                    
                    <div class="element">
                        <img src="./img/icons/CSS.png" alt="icone do CSS3." class="icon img-skills">
                        <h4>CSS3</h4>
                    </div>
                    <div class="barra" data-level="avancado"></div>
                </div>
            </button>

            <!-- Back-end -->
            
            <button type="button" id="backend" class="cards-section">

                <!-- Titúlo Back-end -->
                
                <div class="title-element">
                    <img src="./img/icons/Back-end.png" alt="">
                    <h3>Back-end</h3>
                    
                    <div>
                        <p>+</p>
                    </div>
                </div>

                <!-- Elementos Back-end -->
                
                <div class="elements-section">

                    <div class="element">
                        <img src="./img/icons/Python.png" alt="icone do Python." class="icon img-skills">
                        <h4>Python</h4>
                    </div>
                    <div class="barra" data-level="basico"></div>
                    
                    <div class="element">
                        <img src="./img/icons/C.png" alt="icone do C." class="icon img-skills">
                        <h4>C</h4>
                    </div>
                    <div class="barra" data-level="basico"></div>

                    <div class="element">
                        <img src="./img/icons/PostgreSQL.png" alt="icone do PostgreSQL." class="icon img-skills">
                        <h4>PostgreSQL</h4>
                    </div>
                    <div class="barra" data-level="intermediario"></div>
                </div>
            </button>

            <!-- Ferramentas -->
            
            <button type="button" id="ferramenta" class="cards-section">

                <!-- Titúlo Ferramentas -->
                
                <div class="title-element">
                    <img src="./img/icons/Ferramenta.png" alt="">
                    <h3>Ferramentas</h3>

                    <div>
                        <p>+</p>
                    </div>
                </div>

                <!-- Elementos Ferramentas -->
                
                <div class="elements-section">

                    <div class="element">
                        <img src="./img/icons/GIT.png" alt="icone do Git." class="icon img-skills">
                        <h4>Git/GitHub</h4>
                    </div>
                    <div class="barra" data-level="intermediario"></div>
                </div>
            </button>
        </section>
    </main>

    <!-- Fundo -->
    
    <div id="blur" class="disable"></div>
    
    <footer id="rodape">
        <p>GUSTAVO VITÓRIO - FULL-STACK DEVELOPER - 2026</p>
    </footer>
</body>
<script src="./js/skills.js"></script>
<script src="./js/nav_bar.js"></script>
</html>

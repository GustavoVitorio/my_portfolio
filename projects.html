<body>
    <div id="introducao">
        <header>
            <button type="button" id="nav_bar">

                <img src="./img/icons/seta_para_baixo__azul.png" alt="seta para baixo">
            </button>
        </header>
        <nav>
            <a href="./index.html" id="home" class="link-nav">HOME</a>
            <a href="./about.html" id="about" class="link-nav">SOBRE</a>
            <a href="./skills.html" id="skills" class="link-nav">SKILLs</a>

        </nav>

    <main>
        <h1>Soluções e <span>Projetos</span></h1>
        <section>

            <div class="separacao">
                <div class="element-section">
                    <img src="./img/icons/Loja.png" alt="Icone de uma loja.">
                    <div class="text-section">
                        <h3>E-comerce Plataform</h3>
                        <p>Plataforma completa com checkout seguro, gestão de inventário e painel administartivo.</p>
                    </div>              
                    <div class="icons-element">
                        <div class="bar">
                            <div class="text white">
                                <span>HTML</span>
                                <span class="disable">30%</span>
                            </div>
                            <div class="progress" style="--valor: 30%">
                                <div class="text black">
                                    <span class="disable">HTML</span>
                                    <span class="number disable">30%</span>
                                </div>
                            </div>
                        </div>
                        <div class="bar">
                            <div class="text white">
                                <span>CSS</span>
                                <span class="disable">50%</span>
                            </div>
                            <div class="progress" style="--valor: 50%">
                                <div class="text black">
                                    <span class="disable">CSS</span>
                                    <span class="number disable">50%</span>
                                </div>
                            </div>
                        </div>
                        <div class="bar">
                            <div class="text white">
                                <span>JS</span>
                                <span class="disable">20%</span>
                            </div>
                            <div class="progress" style="--valor: 20%">
                                <div class="text black">
                                    <span class="disable">JS</span>
                                    <span class="number disable">20%</span>
                                </div>

                        <img src="./img/icons/seta_baixo.png" alt="Uma seta." class="icon">

                    <a href="https://github.com/GustavoVitorio" target='_blank' class="btn-repo btn disable">
